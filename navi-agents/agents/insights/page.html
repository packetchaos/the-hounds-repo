<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>On the Scent · Navi Agents</title>
<link rel="stylesheet" href="/static/console.css"/>
<style>

  .fresh.warn{border-left-color:var(--high)} .fresh.run{border-left-color:var(--accent)} .fresh .sp{flex:1}
  .fresh a{color:var(--accent)} .fresh .btn{color:#fff} .fresh .btn.ghost{color:var(--ink)}

  .ctsub{color:var(--ink-3);font-size:12px;margin:2px 0 10px}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}

  .ph a{color:var(--accent)}
  .sact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin:-4px 0 6px}

  .waffle{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;flex:1;min-width:min(200px,100%);max-width:340px}
  .waffle a{aspect-ratio:1;border-radius:3px;display:block}
  .b-critical{background:var(--crit)} .b-high{background:var(--high)} .b-elevated{background:var(--med)} .b-low{background:var(--low)} .b-clean{background:var(--ok)}
  .leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}

  .leg a:hover{border-color:var(--accent)} .leg .sw{width:10px;height:10px;border-radius:3px} .leg b{color:var(--ink)}

  .fp a:hover{background:var(--panel-2)}

  .fp .rt{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink-2);line-height:1.3} .fp .rt b{color:var(--ink)} .fp .rt small{display:block;font-size:9.5px;color:var(--ink-3);white-space:nowrap}
  @media(max-width:560px){.fp a{grid-template-columns:minmax(0,1fr) 112px}.fp .trk{grid-column:1/-1;order:3}}
  /* worst assets x hound matrix */

  .mx td.c{border-radius:4px;min-width:16px;background:color-mix(in srgb,var(--accent) calc(var(--a)*100%),var(--line-soft))}

  /* cert wall */

  .clk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px;margin-top:10px}

  .clk a:hover{border-color:var(--accent)} .clk .v{font-family:var(--display);font-weight:700;font-size:18px} .clk .l{font-size:11px;color:var(--ink-3)}
  .clk a.na .v{color:var(--ink-3);font-size:15px}
  /* signal stack */

  .hist .bar span{position:absolute;top:-16px;left:-6px;right:-6px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink)}

  .hist a:hover .bar{outline:2px solid var(--accent)}
  .axisn{font-size:11px;color:var(--ink-3);text-align:center;margin-top:4px}
  /* co-occurrence */
  .co{border-collapse:separate;border-spacing:2px;font-size:10.5px;margin:0 auto}
  .co td,.co th{border:0;padding:0;text-align:center}
  .co th{font-size:10px;color:var(--ink-3);letter-spacing:0;text-transform:none;font-family:var(--body);padding:0 3px;font-weight:500}
  .co th.r{text-align:right;padding-right:6px}
  .co td a{display:flex;align-items:center;justify-content:center;width:34px;height:28px;border-radius:5px;text-decoration:none;font-family:var(--mono);color:var(--ink);
    background:color-mix(in srgb,var(--crit) calc(var(--a)*100%),var(--line-soft))}
  .co td a.dk{color:#fff} .co td a.dg{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
  .co td a:hover{outline:2px solid var(--accent)}
  @media(max-width:480px){.co td a{width:25px;height:24px;font-size:9.5px}}
  .conv{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .cv{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:var(--panel-2)}
  .cv .cn{font-family:var(--display);font-weight:700;font-size:22px;text-align:center;text-decoration:none;border-radius:8px;padding:2px 0}
  .cv .cn:hover{outline:2px solid var(--accent)}
  .cv.crit{box-shadow:inset 3px 0 0 var(--crit)} .cv.crit .cn{color:var(--crit)} .cv.warn{box-shadow:inset 3px 0 0 var(--high)} .cv.warn .cn{color:var(--high)}
  .cv .pair{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:2px} .cv .cgo{font-family:var(--mono);font-size:10.5px;color:var(--accent);white-space:nowrap;text-decoration:none}
  .cv .cgo:hover{text-decoration:underline}
  .sevt{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px;color:var(--ink-2)}
  @media(max-width:480px){.cv{grid-template-columns:44px minmax(0,1fr)}.cv .cgo{grid-column:2}}
  /* blind steps */
  .steps{display:flex;flex-direction:column;gap:10px}
  .steps a{text-decoration:none;color:inherit;display:block;border-radius:8px;padding:2px 4px}.steps a:hover{background:var(--panel-2)}
  .steps .hd{display:flex;justify-content:space-between;gap:10px;font-size:12.5px} .steps .hd .n{font-family:var(--mono);color:var(--ink-2);white-space:nowrap}
  .steps .trk{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-top:4px;gap:2px;background:var(--line-soft)}
  .steps .seen{background:var(--ok);border-radius:4px 0 0 4px}
  .steps .gap{background:repeating-linear-gradient(135deg,var(--crit-bg) 0 4px,transparent 4px 8px);border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);border-radius:0 4px 4px 0;box-sizing:border-box}
  .steps .gl{font-size:10.5px;color:var(--crit);margin-top:2px}.steps .own{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
  .bt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px}
  .bt a{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel-2);text-decoration:none;color:inherit}
  .bt a:hover{border-color:var(--accent)} .bt .v{font-family:var(--display);font-weight:700;font-size:20px} .bt .l{font-size:11.5px;color:var(--ink)} .bt .o{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
  .bt a.na .v{color:var(--ink-3);font-size:15px}
  /* next moves */
  .nx{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:10px}
  .nx a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);text-decoration:none;color:inherit}
  .nx a:hover{border-color:var(--accent)}
  .nx .rk{grid-row:span 3;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
  .nx a.crit .rk{background:var(--crit);color:#fff} .nx a.warn .rk{background:var(--high);color:#111}
  .nx .vb{font-weight:700;font-size:13.5px}.nx .nn{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}.nx .nn small{font-size:11.5px;color:var(--ink-3);font-weight:400;font-family:var(--body);margin-left:5px}
  .nx .dt{font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere} .nx .hh{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--accent)}
  .ladder{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .ladder>a{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;text-decoration:none;color:inherit;font-size:12px}
  .ladder>a:hover span:first-child{color:var(--accent)}
  .ladder i{display:block;height:16px;border-radius:4px;background:var(--accent2)} .ladder .n{font-family:var(--mono);text-align:right}
  .ladder .champ a{color:var(--accent)}
  @media(max-width:480px){.ladder>a{grid-template-columns:110px minmax(0,1fr) 54px}}
  /* pack coverage */
  .pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:8px}
  .pack a{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2);text-decoration:none;color:inherit}
  .pack a:hover{border-color:var(--accent)} .pack .d{width:12px;height:12px;border-radius:4px;border:1px solid transparent}
  .pack .nm{font-size:12.5px;font-weight:600} .pack .mt{grid-column:2;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);overflow-wrap:anywhere}
  /* none state */
  .cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

  @media(max-width:600px){.tmap{height:320px}.mk .v{font-size:19px}}

</head><body data-page-cache="off">
<div class="wrap">
  <header class="top" id="app-header"></header>
  <section class="card" id="hero" style="background:radial-gradient(120% 140% at 90% -20%,var(--amber-glow),transparent 60%),var(--panel)">
    <div class="acode">Sphinx · the estate brain</div>
    <h2 style="margin:2px 0 0">🐝 On the Scent</h2>
    <p class="story" id="story">Reading the pack's last release…</p>
    <div class="fresh run" id="fresh"><span class="spin"></span><span>peeking the stored summary (reads the release's caches only)…</span></div>
    <div id="flash" class="flash"></div>
  </section>
  <div id="board"></div>
  <footer>Sphinx · built from the pack's released results (page cache + snapshots) · never re-runs a hound, never reads navi.db</footer>
</div>
<script src="/static/console.js"></script>
<script>
/* On the Scent — every number here is the owning hound's own (as of the last Release the
   Hounds) and links back to it. The page only PEEKS the stored digest; ↻ Rebuild re-reads
   the caches (never navi.db). No data-run, no page cache (data-page-cache="off"). */
const API=agentApi('insights');
let D=null, POLL=null;
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'—':Number(n).toLocaleString();
const P=(a,s)=>'/agents/'+a+'/page.html'+(s?'#'+s:'');
const SEVW={crit:'critical',warn:'warning'};
const SEVC={crit:'var(--crit)',warn:'var(--high)'};
const SL={fresh:'released',user:'your newer run',stale:'stale — navi.db changed',missing:'not run',error:'error',skipped:'skipped',live:'live page',
          pending:'waiting',running:'running',done:'done',cancelled:'cancelled'};
function ago(ms){ if(!ms) return '—'; const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return Math.round(s/86400)+' d ago'; }
const absT=ms=>ms?new Date(ms).toLocaleString():'';
const cov=a=>(D&&D.coverage||[]).find(c=>c.agent===a)||{};
const nm=a=>({fused_score:'Nemesis',acr:'Anubis',exproute:'Atlas'}[a]||cov(a).codename||a);
const ic=a=>({fused_score:'🎯',acr:'🎯',exproute:'🧭'}[a]||cov(a).icon||'');
const ph=(msg,a)=>`<div class="ph">${esc(msg)}${a?` — <a href="${esc(P(a))}">open ${esc(nm(a))} →</a>`:''}</div>`;

/* ---------------------------------------------------------------- data */
async function peek(){
  let o; try{ o=await API.post('scent',{peek:true,_nocache:true}); }catch(e){ o={ok:false,error:e.message}; }
  if(!o||!o.ok||!o.result){ flash('flash','✗ '+esc((o&&o.error)||'could not read the summary'),'crit'); $('fresh').style.display='none'; return; }
  D=o.result; render();
}
async function rebuild(btn){
  if(btn) btn.disabled=true;
  flash('flash','<span class="spin"></span> rebuilding the summary from the cached release (no navi.db reads)…','run');
  let o; try{ o=await API.post('scent',{force:true,_nocache:true}); }catch(e){ o={ok:false,error:e.message}; }
  if(btn) btn.disabled=false;
  if(!o||!o.ok){ flash('flash','✗ '+esc((o&&o.error)||'rebuild failed'),'crit'); return; }
  flashClear('flash'); D=o.result; render();
}
function schedule(){ clearTimeout(POLL);
  if(D&&D.running) POLL=setTimeout(pollRelease,2000);
  else if(D&&D.building&&D.building.job_id) POLL=setTimeout(pollJob,1500); }
async function pollRelease(){
  let o; try{ o=await jpost('/api/hub/release_status',{}); }catch(e){ o=null; }
  const st=o&&o.state;
  if(st&&st.status==='running'){ D.progress={id:st.id,items:(st.items||[]).map(i=>({agent:i.agent,label:i.label,status:i.status}))}; renderFresh(); POLL=setTimeout(pollRelease,2000); }
  else peek();
}
async function pollJob(){
  let j=null; try{ const r=await jget('/api/jobs/'+encodeURIComponent(D.building.job_id)); j=r&&r.job; }catch(e){}
  if(j&&!/^(done|error)$/.test(j.status)){ POLL=setTimeout(pollJob,1500); return; }
  if(j&&j.status==='error') flash('flash','✗ summary build failed: '+esc(j.message||''),'crit');
  peek();
}

/* ---------------------------------------------------------------- hero */
function renderStory(){
  const s=D.story||[];
  $('story').innerHTML=s.length?s.map(x=>x.href?`<a class="${x.sev==='crit'?'c':x.sev==='warn'?'w':''}" href="${esc(x.href)}">${esc(x.t)}</a>`:esc(x.t)).join('')
    :'The pack\'s released results, rolled up into one picture — every number links to the hound that owns it.';
}
function dots(items){ return `<div class="dots">${items.map(c=>`<a class="st-${esc(c.status)}" href="${esc(c.href||P(c.agent))}" title="${esc(c.label)} — ${esc(SL[c.status]||c.status)}"></a>`).join('')}</div>`; }
function tally(rows){ const n={}; rows.forEach(c=>{ n[c.status]=(n[c.status]||0)+1; });
  return Object.keys(n).map(k=>`${n[k]} ${esc(SL[k]||k)}`).join(' · '); }
function renderFresh(){
  const f=$('fresh'), R=D.release||{}, C=(D.coverage||[]).filter(c=>c.kind!=='live');
  const again='<a class="btn sm" href="/?release=1">🐾 Release again</a>';
  if(D.running){ const it=(D.progress&&D.progress.items)||[], todo=it.filter(i=>i.status!=='skipped'), fin=todo.filter(i=>/^(done|error|cancelled)$/.test(i.status)), cur=it.find(i=>i.status==='running');
    f.className='fresh run'; f.innerHTML=`<span class="spin"></span><span>Releasing the hounds… <b>${fin.length} / ${todo.length}</b>${cur?' · '+esc(cur.label)+' running':''} — this page refreshes when the pack is back.</span><span class="sp"></span>`+
      dots(it.map(i=>({agent:i.agent,label:i.label,status:i.status,href:P(i.agent)}))); return; }
  if(D.building&&D.building.job_id){ f.className='fresh run'; f.innerHTML='<span class="spin"></span><span>Summarising the release from its caches (large inputs run on the job queue)…</span>'; return; }
  if(D.state==='none'){ f.style.display='none'; return; }
  f.style.display='';
  const when=`<b title="${esc(absT(R.at||R.built_at))}">${esc(ago(R.at||R.built_at))}</b>`;
  let msg, cls='fresh';
  if(D.state==='stale'){ cls+=' warn';
    msg=`⚠ Built from a release ${when} — <b>navi.db has been updated since</b> (new scan data isn't reflected here).`; }
  else if(D.state==='partial'){ cls+=' warn';
    const miss=C.filter(c=>!/^(fresh|user|stale)$/.test(c.status));

  else msg=`🐾 Released ${when} · <b>${R.hounds_present} of ${R.hounds_total}</b> hounds · ${R.stale?'':'navi.db unchanged since · '}built in ${esc(R.built_sec)} s from cache`;
  let out=`<span>${msg}</span>`;
  if(D.outdated&&D.state!=='stale'){ cls+=' warn';
    const ch=(D.changed||[]);

  out+=dots(C)+`<span class="sub" style="margin:0;font-size:11px">${tally(C)}</span><span class="sp"></span><a class="btn ghost sm" href="#secPack">Coverage</a>`+again;
  f.className=cls; f.innerHTML=out;
}

function treemap(){
  const el=$('tmap'); if(!el||!D||!D.exposure) return;
  const items=(D.exposure.factors||[]).filter(f=>f.total>0), tot=items.reduce((s,f)=>s+f.total,0);
  if(!items.length){ el.innerHTML=ph('No fused exposure points yet'); el.style.height='auto'; return; }
  const out=[]; const worst=(row,w)=>{const s=row.reduce((a,b)=>a+b.v,0),mx=Math.max(...row.map(r=>r.v)),mn=Math.min(...row.map(r=>r.v));return Math.max(w*w*mx/(s*s),(s*s)/(w*w*mn));};
  function sq(list,x,y,w,h){ if(!list.length)return; const short=Math.min(w,h); let row=[list[0]],i=1;
    while(i<list.length&&worst(row.concat(list[i]),short)<=worst(row,short)){row.push(list[i]);i++;}
    const s=row.reduce((a,b)=>a+b.v,0);
    if(w>=h){const rw=s/h;let yy=y;row.forEach(r=>{const rh=r.v/rw;out.push({...r,x,y:yy,w:rw,h:rh});yy+=rh;});sq(list.slice(i),x+rw,y,w-rw,h);}
    else{const rh=s/w;let xx=x;row.forEach(r=>{const rw=r.v/rh;out.push({...r,x:xx,y,w:rw,h:rh});xx+=rw;});sq(list.slice(i),x,y+rh,w,h-rh);} }

    return `<a href="${esc(P(r.agent))}" class="${a>0.6?'dk':''}" style="left:${(r.x/W*100).toFixed(2)}%;top:${r.y.toFixed(2)}%;width:${(r.w/W*100).toFixed(2)}%;height:${r.h.toFixed(2)}%;--a:${a.toFixed(2)}" title="${esc(r.label)} — ${r.pct}% of fused exposure (${fmt(r.total)} pts, ${esc(r.hound)})">`+

  if(!S.length) $('hist').innerHTML=ph('The Exposure Score snapshot isn\'t in this release','fused_score');
  else { const mx=Math.max(1,...S.map(s=>s.assets));
    $('hist').innerHTML=`<div class="hist">`+S.map(s=>`<a href="${P('fused_score','sec-lb')}" title="${fmt(s.assets)} assets with ${esc(s.label)} hound signals"><div class="bar" style="height:${(s.assets/mx*100).toFixed(1)}%;--a:${(0.15+0.85*s.signals/7).toFixed(2)}"><span>${fmt(s.assets)}</span></div><div class="x">${esc(s.label)}</div></a>`).join('')+
      `</div><div class="axisn">hounds firing on the asset →</div>`; }
  const CO=D.cooccur||{}, SG=CO.signals||[], M=CO.matrix||[];
  if(!SG.length){ $('cobasis').textContent=''; $('cowrap').innerHTML=ph('No overlapping signals to map'); }
  else { let off=0; M.forEach((r,i)=>r.forEach((v,j)=>{ if(j<i) off=Math.max(off,v); }));
    $('cobasis').textContent='assets carrying both signals · basis: '+CO.basis+' (Nemesis snapshot) · diagonal = assets with that signal · click → Nemesis';
    const lb=P('fused_score','sec-lb'); let h='';
    SG.forEach((s,i)=>{ h+=`<tr><th class="r">${esc(s.label)}</th>`;
      for(let j=0;j<=i;j++){ const v=M[i][j];
        if(i===j) h+=`<td><a class="dg" href="${lb}" title="${esc(s.label)}: ${fmt(v)} assets">${fmt(v)}</a></td>`;
        else { const a=v&&off?(0.12+0.78*v/off):0; h+=`<td><a class="${a>0.55?'dk':''}" style="--a:${a.toFixed(2)}" href="${lb}" title="${esc(SG[j].label)} + ${esc(s.label)}: ${fmt(v)} assets">${v?fmt(v):''}</a></td>`; } }
      h+='</tr>'; });
    h+='<tr><th></th>'+SG.map(s=>`<th title="${esc(s.label)}">${esc(s.label.slice(0,5))}</th>`).join('')+'</tr>';
    $('cowrap').innerHTML=`<table class="co norsz">${h}</table>`; }
  const CV=D.convergence||[];
  $('conv').innerHTML=CV.length?CV.map(c=>`<div class="cv ${esc(c.sev)}"><a class="cn" href="${esc(c.href)}" title="${esc(c.text)}: ${fmt(c.n)} (${esc(c.rule||'Nemesis')}) — open Nemesis">${fmt(c.n)}</a>`+
      `<span>${esc(c.text)}<span class="sevt">${esc(SEVW[c.sev]||c.sev)}</span><div class="pair">${esc(c.pair)}${c.rule?' · '+esc(c.rule):''}</div></span>`+
      `<a class="cgo" href="${esc(c.fix_href)}">fix → ${esc(nm(c.a))}</a></div>`).join('')
    :ph((D.exposure||{}).available?'No cross-hound overlaps on this estate — nothing converges':'The Exposure Score snapshot isn\'t in this release','fused_score');
}
function renderBlind(){
  const T=Math.max(1,D.blind.assets||0);
  $('steps').innerHTML=D.blind.funnel.map(f=>{ if(f.n==null) return `<a href="${esc(f.href)}"><div class="hd"><b>${esc(f.label)}</b><span class="n">—</span></div><div class="gl" style="color:var(--ink-3)">${esc(f.codename)} · not in this release</div></a>`;
    const p=Math.min(100,f.n/T*100);
    return `<a href="${esc(f.href)}" title="${esc(f.label)}: ${fmt(f.n)} of ${fmt(T)} assets — ${esc(f.codename)}"><div class="hd"><b>${esc(f.label)}</b><span class="n">${fmt(f.n)} · ${Math.round(p)}%</span></div>`+
      `<div class="trk"><div class="seen" style="width:${p.toFixed(1)}%"></div>${f.gap?`<div class="gap" style="width:${(100-p).toFixed(1)}%"></div>`:''}</div>`+
      (f.gap?`<div class="gl">▹ ${fmt(f.gap)} ${esc(f.gap_label)} <span class="own">· ${esc(f.codename)}</span></div>`:'')+'</a>';}).join('');
  $('bt').innerHTML=D.blind.tiles.map(t=>`<a class="${t.n==null?'na':''}" href="${esc(t.href)}" title="${esc(t.label)}${t.note?' — '+esc(t.note):''}"><div class="v">${t.n==null?'no data':fmt(t.n)}</div><div class="l">${esc(t.label)}</div><div class="o">${esc(ic(t.agent))} ${esc(t.codename)}${t.note?' · '+esc(String(t.note).split(' — ')[0]):''}</div></a>`).join('');
}
function renderNext(){
  const X=D.next||[];
  $('nx').innerHTML=X.length?X.map((x,i)=>`<a class="${esc(x.sev)}" href="${esc(x.href)}" title="${esc(x.verb)} — ${esc(SEVW[x.sev]||'')}"><span class="rk">${i+1}</span><span class="vb">${esc(x.verb)}</span><span class="nn">${fmt(x.n)}<small>${esc(x.unit)}</small></span><span class="dt">${esc(x.detail)}</span><span class="hh">${esc(SEVW[x.sev]||'')} · ${esc(x.icon)} ${esc(x.codename)} →</span></a>`).join('')
    :ph('Nothing to hand off from this release');
  const R=D.reduction||{};
  if(R.cves==null){ $('ladder').innerHTML=ph('Exposure Routes (Atlas) isn\'t in this release','exproute'); return; }
  const st=[['CVE line-items',R.cves,'/agents/ex_vulns/page.html'],['Findings',R.findings,'/agents/ex_vulns/page.html'],['Plugins — one fix each',R.plugins,'/agents/ex_plugins/page.html'],['Routes — one owner each',R.routes,P('exproute','secMap')],['Paths',R.paths,'/agents/ex_paths/page.html']];
  const mx=Math.log10(Math.max(1,...st.map(s=>s[1]||0))+1)||1;
  $('ladder').innerHTML=st.map(s=>`<a href="${s[2]}" title="${esc(s[0])}: ${fmt(s[1])}"><span>${esc(s[0])}</span><i style="width:${Math.max(2,Math.log10((s[1]||0)+1)/mx*100).toFixed(1)}%"></i><span class="n">${fmt(s[1])}</span></a>`).join('')+
   (R.champion&&R.champion.plugin_id?`<p class="sub champ" style="margin:6px 0 0;font-size:12px">🏆 One fix, ${fmt(R.champion.cve_count)} CVEs — <a href="/web/vuln.html?plugin=${encodeURIComponent(R.champion.plugin_id)}">${esc(R.champion.name)}</a></p>`:'');
}
function renderPack(){
  $('pack').innerHTML=(D.coverage||[]).map(c=>`<a href="${esc(c.href)}" title="${esc(c.label)} — ${esc(SL[c.status]||c.status)}${c.note?' · '+esc(c.note):''}"><span class="d st-${esc(c.status)}"></span><span class="nm">${esc(c.icon)} ${esc(c.label)}</span>`+
    `<span class="mt">${esc(SL[c.status]||c.status)}${c.at?' · '+esc(ago(c.at)):''}${c.kb?' · '+esc(c.kb)+' KB':''}${c.note?' · '+esc(c.note):''}</span></a>`).join('');
}

/* one delegated listener for every action (no inline JS built from data) */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-csv]'); if(!b) return;
  if(b.dataset.csv){ const s=SECT[b.dataset.csv]; if(s&&D) downloadCSV('on_the_scent_'+b.dataset.csv.slice(3).toLowerCase(),COLS,s.rows()); return; }
  if(b.dataset.act==='rebuild'||b.dataset.act==='build') rebuild(b);
});
let _rz=null; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(treemap,150); });
mountAgentHeader({id:'insights',icon:'🐝',name:'On the Scent',sub:'Sphinx · the estate brain'});
peek();
</script>
