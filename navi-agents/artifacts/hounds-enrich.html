<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hounds — Data Enrichment</title>
<style>
/* ============================================================================
   HOUNDS · DATA ENRICHMENT ARTIFACT   (rides the shared template shell)
   Data   : window.cowork.callMcpTool(mcp__navi__*)        Reasoning: askClaude (Haiku, NL->SQL)
   Writes : gated confirm modal -> navi_enrich_tag / navi_enrich_acr, recorded to a session tag log.
   Pattern: most enrichment = "find a cohort via SQL, then tag it" -> one shared Find&Tag engine.
   Engine features come from the repo (repo wins); navi is the write surface.
   ========================================================================== */
:root{color-scheme:dark;
  --bg:#0b0c0e;--card:#141519;--panel:#1b1d22;--line:#2a2c33;--ink:#f4f5f2;--ink2:#a7abbd;--ink3:#71768a;
  --accent:#6d70e6;--accent2:#8f92f0;
  --crit:#ff5b6e;--high:#ff9a4d;--med:#ffd24a;--low:#82bbff;--ok:#43b98a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.logo.sm{width:26px;height:26px;border-radius:7px;font-size:13px}
h1{font-size:19px;margin:0;font-weight:700}.top .sub{font-size:12px;color:var(--ink2);margin:1px 0 0}
.meta{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.chip.live{color:var(--ok);border-color:rgba(67,185,138,.45);background:rgba(67,185,138,.12)}
.chip.demo{color:var(--med);border-color:rgba(255,210,74,.4);background:rgba(255,210,74,.1)}
.chip.gate{color:var(--crit);border-color:rgba(255,91,110,.45);background:rgba(255,91,110,.12)}
.chip.btn{cursor:pointer}.chip.btn:hover{border-color:var(--accent);color:var(--ink)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);padding:8px 0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
nav.tabs button:hover{border-color:var(--accent);color:var(--ink)}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-top:14px}
h2.ct{font-size:15px;margin:0}.sub{color:var(--ink2)}
.err{display:none;font-size:12px;color:#ffd98a;background:rgba(255,210,74,.08);border:1px solid rgba(255,210,74,.3);border-radius:8px;padding:8px 11px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--mono);font-size:12.5px;background:#0e0f14;color:var(--ink);resize:vertical}
input.val{width:auto;min-width:220px;flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff} .btn.pri:hover{background:var(--accent2)}
.btn.sm{padding:5px 10px;font-size:12px} .btn:disabled{opacity:.5;cursor:default}
.callbox{font-family:var(--mono);font-size:11.5px;background:#0a0b14;color:#d7d9f5;border-radius:9px;padding:10px 12px;margin-top:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.callbox .k{color:#8fe3c4}.callbox .t{color:#c6b6ff}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.mono,.mono{font-family:var(--mono)}
.tablewrap{overflow-x:auto;max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.tablewrap table{margin:0}.tablewrap th{position:sticky;top:0;background:var(--panel)}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(67,185,138,.45)}.pill.err{color:var(--crit);border-color:rgba(255,91,110,.45)}.pill.run{color:var(--low);border-color:rgba(130,187,255,.45)}
.selrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-top:6px}
.selrow .nm b{color:var(--ink)}.selrow .nm span{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.selrow .ct{margin-left:auto;font-family:var(--mono);color:var(--ink2)}
.fixed{font-family:var(--mono);font-size:12px;color:var(--accent2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel);white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(6,7,12,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:540px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mbox h3{margin:0 0 6px;font-size:16px}
.foot{color:var(--ink3);font-size:11.5px;margin-top:22px;text-align:center}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px}
select{background:#0e0f14;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px}
.reasons label{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="logo">🏷</div>
    <div><h1>The Hounds — Data Enrichment</h1>
      <div class="sub">Classify · tag · calibrate — on the navi MCP, in Claude, no repo · writes gated + logged</div></div>
    <div class="meta">
      <span class="chip gate" id="gateChip">writes: gated</span>
      <span class="chip" id="srcChip">…</span>
      <span class="chip btn" id="retry">⟳ recheck</span>
    </div>
  </header>
  <div class="err" id="err"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="mTitle">Confirm write</h3>
  <p class="sub" id="mBody" style="font-size:13px"></p>
  <div id="mCall"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="mCancel">Cancel</button><button class="btn pri" id="mOk">Confirm write</button></div>
</div></div>

<script>
const NAVI='mcp__navi__';
const SCHEMA='navi.db: assets(uuid,hostname,ip_address,operating_system,acr,aes), vulns(asset_uuid,plugin_id,plugin_name,severity,state,cves,xrefs,output), tags(asset_uuid,tag_key,tag_value), plugins(plugin_id,name,cves), vuln_route(app_name,plugin_list), vuln_paths(path,plugin_id,asset_uuid). KEV = xrefs LIKE \'%CISA-KNOWN-EXPLOITED%\'.';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString();
let LIVE=false, LASTERR='', TAGLOG=[];

/* ---------- MCP + reasoning ---------- */
async function mcp(tool,args){
  if(!window.cowork||!window.cowork.callMcpTool){ LASTERR='Not inside Cowork (no callMcpTool).'; return {ok:false,error:LASTERR}; }
  try{ const r=await window.cowork.callMcpTool(NAVI+tool,args||{});
    if(r&&r.isError){ LASTERR=NAVI+tool+' → '+((r.content&&r.content[0]&&r.content[0].text)||'tool error'); return {ok:false,error:LASTERR}; }
    return {ok:true,data:r.structuredContent??(r.content&&r.content[0]?JSON.parse(r.content[0].text):null)};
  }catch(e){ LASTERR=NAVI+tool+' → '+(e&&e.message||e); return {ok:false,error:LASTERR}; }
}
const query=(sql,limit)=>mcp('navi_explore_query',{sql,limit:limit||500});
const info=(sub)=>mcp('navi_explore_info',{subcommand:sub});
function rows(d){ if(!d)return[]; if(Array.isArray(d))return d; for(const k of['rows','results','data','result']) if(Array.isArray(d[k]))return d[k]; return []; }
async function askSQL(nl,hint){
  if(!window.cowork||!window.cowork.askClaude) return null;
  const p='Convert to ONE read-only SQLite SELECT that returns a column named asset_uuid, for a Tenable navi.db. '+SCHEMA+
    (hint?(' Hint: '+hint):'')+' Request: "'+nl+'". Return ONLY the SQL, no fences, single statement.';
  try{ let r=await window.cowork.askClaude(p,[]); r=(typeof r==='string')?r:(r&&(r.text||r.output||''))+'';
    return r.replace(/```sql|```/gi,'').trim().replace(/;+\s*$/,'')+';'; }catch(e){ return null; }
}
function callHTML(tool,args){ return '<div class="callbox"><span class="k">callMcpTool</span>(<span class="t">"'+NAVI+tool+'"</span>, '+esc(JSON.stringify(args))+')</div>'; }
function tableHTML(rs){ if(!rs.length) return '<p class="sub" style="margin-top:8px">No rows.</p>';
  const cols=Object.keys(rs[0]);
  return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
    rs.slice(0,200).map(r=>'<tr>'+cols.map(c=>'<td class="mono">'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
    (rs.length>200?'<p class="sub">first 200 of '+fmt(rs.length)+'</p>':''); }

/* ---------- gated write modal + session tag log ---------- */
let _res=null;
function confirmWrite(title,body,call){ $('mTitle').textContent=title; $('mBody').innerHTML=body; $('mCall').innerHTML=call||''; $('modal').classList.add('on'); return new Promise(r=>_res=r); }
$('mCancel').onclick=()=>{ $('modal').classList.remove('on'); _res&&_res(false); };
$('mOk').onclick=()=>{ $('modal').classList.remove('on'); _res&&_res(true); };
async function gatedWrite(meta,tool,args){
  const ok=await confirmWrite(meta.title,meta.body,callHTML(tool,args)); if(!ok) return {ok:false,cancelled:true};
  const e={ts:new Date().toLocaleTimeString(),op:meta.op,category:args.category,value:args.value,selector:meta.selector||'',status:'running',detail:''};
  TAGLOG.unshift(e); renderTagLog(); renderContract();
  const r=await mcp(tool,Object.assign({confirm:true},args));
  e.status=r.ok?'done':'error'; e.detail=r.ok?(meta.doneNote||'applied'):(r.error||'failed');
  if(r.ok&&r.data&&r.data.writes_enabled===false){ e.status='blocked'; e.detail='writes gated on navi MCP (NAVI_MCP_ALLOW_WRITES not set)'; }
  renderTagLog(); renderContract(); return r;
}
function renderTagLog(){ const b=$('tlBody'); if(!b) return;
  if(!TAGLOG.length){ b.innerHTML='<p class="sub" style="margin-top:8px">No writes yet this session.</p>'; return; }
  b.innerHTML='<div class="tablewrap"><table><thead><tr><th>Time</th><th>Op</th><th>Tag / target</th><th>Selector</th><th>Result</th></tr></thead><tbody>'+
    TAGLOG.map(e=>{const p=e.status==='done'?'ok':e.status==='running'?'run':'err';
      return '<tr><td class="mono">'+esc(e.ts)+'</td><td>'+esc(e.op)+'</td><td class="mono">'+esc((e.category||'')+(e.value?' : '+e.value:''))+'</td><td class="mono">'+esc(e.selector)+'</td><td><span class="pill '+p+'">'+esc(e.status)+'</span> <span class="sub">'+esc(e.detail)+'</span></td></tr>';}).join('')+'</tbody></table></div>'; }

/* ============================ FIND & TAG engine (shared by 5 agents) ============================ */
/* All enrichment agents now have dedicated full-parity panels (Linnaeus/Cerberus/Janus/
   Mimir/Cavall below; Sirius/Anubis/Covenant further down). ENRICH stays empty — the generic
   find&tag helpers (findTagHTML/wireFindTag) are retained because Software reuses them for its
   tag sub-block. */
const ENRICH=[];
function findTagHTML(c){ const i=c.id;
  return `<div class="card"><div class="row"><div class="logo sm">${c.icon}</div><div><h2 class="ct">${c.name}</h2><div class="sub" style="font-size:12px">${c.code} · find a cohort with SQL, then tag it — gated + logged</div></div></div>
    <div class="row" style="margin-top:10px"><input type="text" id="${i}-nl" class="val" placeholder="describe the cohort in plain English…" value="${esc(c.nl)}"><button class="btn" id="${i}-draft">✨ Draft SQL</button></div>
    <textarea id="${i}-sql" rows="3" style="margin-top:8px">${esc(c.sql)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="${i}-run">▶ Preview cohort</button><span class="sub" id="${i}-msg" style="font-size:12px"></span></div>
    <div id="${i}-cb"></div><div id="${i}-res"></div>
    <div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <span class="fixed">${esc(c.category)}</span><span class="sub">:</span>
      <input type="text" id="${i}-val" class="val" placeholder="${esc(c.valuePh)}">
      <button class="btn pri" id="${i}-tag">🏷 Tag matched assets</button><span class="sub" id="${i}-tagmsg" style="font-size:12px"></span></div>
    <p class="note">The SQL must return a column named <code>asset_uuid</code>. Full detection engines (fusion, term packs, NL classification) live in the repo/navi — this panel is the SQL-expressible slice; deeper detection is a future navi engine tool.</p></div>`;
}
function wireFindTag(c){ const i=c.id; let cohortSQL=c.sql, cohortCount=null;
  $(i+'-draft').onclick=async()=>{ const nl=$(i+'-nl').value.trim(); if(!nl)return; $(i+'-msg').textContent='drafting…';
    const sql=await askSQL(nl,c.hint); if(!sql){ $(i+'-msg').innerHTML='<span style="color:var(--crit)">reasoning unavailable</span>'; return; }
    $(i+'-sql').value=sql; $(i+'-msg').textContent='drafted — preview, then tag.'; };
  $(i+'-run').onclick=async()=>{ cohortSQL=$(i+'-sql').value.trim(); $(i+'-cb').innerHTML=callHTML('navi_explore_query',{sql:cohortSQL,limit:200});
    $(i+'-msg').textContent='running…'; const r=await query(cohortSQL,200);
    if(!r.ok){ $(i+'-msg').innerHTML='<span style="color:var(--crit)">✗ '+esc(r.error)+'</span>'; return; }
    const rs=rows(r.data); cohortCount=rs.length; $(i+'-msg').textContent=fmt(rs.length)+' asset(s) match'; $(i+'-res').innerHTML=tableHTML(rs); };
  $(i+'-tag').onclick=async()=>{ const val=$(i+'-val').value.trim(); cohortSQL=$(i+'-sql').value.trim();
    if(!val){ $(i+'-tagmsg').innerHTML='<span style="color:var(--crit)">enter a value</span>'; return; }
    const r=await gatedWrite({op:'tag',title:'Apply tag',selector:'query',doneNote:'tag queued',
      body:'Tag every asset returned by this query <b>'+esc(c.category)+' : '+esc(val)+'</b>'+(cohortCount!=null?(' (~<b>'+fmt(cohortCount)+'</b> matched on last preview)'):'')+'? Gated navi write.'},
      'navi_enrich_tag',{category:c.category,value:val,query:cohortSQL});
    if(r.cancelled){ $(i+'-tagmsg').textContent=''; return; }
    $(i+'-tagmsg').innerHTML=r.ok?'<span style="color:var(--ok)">✓ queued — see Tag log / AI Contract. ~30 min propagation.</span>':'<span style="color:var(--crit)">✗ '+esc(r.error||'failed')+'</span>'; };
}

/* ============================ AGENT GROUPS (Sirius) — full parity ============================
   Repo parity: list every Tenable agent group with member count, tag each group as
   `Agent Group : <name>` via navi_enrich_tag group=<name> (server-side membership,
   no UUID cap), tag-all in one sweep, and hand the whole set to the AI Contract as
   the `agentgroup` tagger. Live from Tenable via navi_explore_info agent_groups. */
let GROUPS=[];
function groupsHTML(){ return `<div class="card"><div class="row"><div class="logo sm">🛰️</div><div><h2 class="ct">Agent Groups</h2><div class="sub" style="font-size:12px">Sirius · turn Tenable agent-group membership into <code>Agent Group : &lt;name&gt;</code> tags</div></div>
    <button class="btn sm" id="grpLoad" style="margin-left:auto">Load groups</button></div>
    <div class="row" id="grpBulk" style="margin-top:10px;display:none"><span class="sub" id="grpStat" style="font-size:12px"></span><button class="btn pri" id="grpTagAll" style="margin-left:auto">🏷 Tag ALL groups</button></div>
    <div id="grpList"></div>
    <p class="note">Each group tags server-side by membership (<code>--group</code>) so there is no 1999-UUID cap. Enable the <b>Agent groups</b> tagger in the AI Contract to keep these in sync on every cycle.</p></div>`; }
async function grpTagOne(nm){
  return gatedWrite({op:'tag',title:'Tag agent group',selector:'group='+nm,doneNote:'group tag queued',
    body:'Tag all assets in agent group <b>'+esc(nm)+'</b> as <b>Agent Group : '+esc(nm)+'</b>? Gated navi write.'},
    'navi_enrich_tag',{category:'Agent Group',value:nm,group:nm});
}
function wireGroups(){ $('grpLoad').onclick=async()=>{ $('grpList').innerHTML='<p class="sub">loading agent groups (live from Tenable)…</p>';
    const r=await info('agent_groups'); if(!r.ok){ $('grpList').innerHTML='<p class="sub" style="color:var(--crit)">✗ '+esc(r.error)+'</p>'; $('grpBulk').style.display='none'; return; }
    const gs=rows(r.data); if(!gs.length){ $('grpList').innerHTML='<p class="sub">No agent groups returned.</p>'; $('grpBulk').style.display='none'; return; }
    const nameKey=Object.keys(gs[0]).find(k=>/name/i.test(k))||Object.keys(gs[0])[0];
    const cntKey=Object.keys(gs[0]).find(k=>/count|agents|members/i.test(k));
    GROUPS=gs.map(g=>({name:g[nameKey],count:cntKey?g[cntKey]:null}));
    const totalAgents=GROUPS.reduce((a,g)=>a+(parseInt(g.count,10)||0),0);
    $('grpStat').textContent=fmt(GROUPS.length)+' groups'+(cntKey?' · '+fmt(totalAgents)+' agents total':'');
    $('grpBulk').style.display='flex';
    $('grpList').innerHTML=GROUPS.map((g,idx)=>
      '<div class="selrow"><span class="nm"><b>'+esc(g.name)+'</b><span>agent group</span></span>'+(g.count!=null?'<span class="ct">'+esc(g.count)+' agents</span>':'')+'<button class="btn sm grpTag" data-nm="'+esc(g.name)+'">🏷 Tag</button></div>').join('');
    document.querySelectorAll('.grpTag').forEach(b=>b.onclick=()=>grpTagOne(b.dataset.nm)); };
  $('grpTagAll').onclick=async()=>{ if(!GROUPS.length)return;
    if(!confirm('Tag ALL '+GROUPS.length+' agent groups? Each is a gated navi write applied in sequence.'))return;
    $('grpStat').textContent='tagging '+GROUPS.length+' groups…'; let done=0;
    for(const g of GROUPS){ const r=await grpTagOne(g.name); if(r&&r.ok)done++; if(r&&r.cancelled)break; }
    $('grpStat').innerHTML='<span style="color:var(--ok)">✓ queued '+done+'/'+GROUPS.length+' group tags — see Tag log. ~30 min propagation.</span>'; }; }

/* ============================ ASSET CLASSIFICATION (Linnaeus) — full parity ============================
   Repo parity: per-class breakdown (Windows/Linux/macOS/Network/IoT/OT/Virtual/Cloud/Other/
   Unclassified), OS-family cohorts, custom-facet classification, and tag-by-class under the
   UNIFIED scheme — category 'Asset Inventory', value '<Facet>: <Value>' — which the classifier
   and IoT squad both map onto the graphs. Tags via a `query` selector (cap-free, server-side).
   needs-navi: (1) the full multi-signal classifier CASE incl. network host-name + cloud-metadata
   provenance (core/classify.py classify()); (2) OS confidence cohorts parse plugin 11936 OUTPUT
   (os_confidence / os_plan) which SQL can't regex — expose as a navi engine tool. This panel
   is the reliable operating_system + device-term slice. */
const CL_FACETS=['Class','OS','Device Type','Virtual Infrastructure'];
const CL_CLASS_SQL="SELECT CASE"
 +" WHEN lower(coalesce(operating_system,'')) LIKE '%windows%' THEN 'Windows'"
 +" WHEN lower(coalesce(operating_system,'')) LIKE '%linux%' OR lower(coalesce(operating_system,'')) LIKE '%ubuntu%' OR lower(coalesce(operating_system,'')) LIKE '%debian%' OR lower(coalesce(operating_system,'')) LIKE '%centos%' OR lower(coalesce(operating_system,'')) LIKE '%red hat%' OR lower(coalesce(operating_system,'')) LIKE '%rhel%' OR lower(coalesce(operating_system,'')) LIKE '%suse%' OR lower(coalesce(operating_system,'')) LIKE '%fedora%' THEN 'Linux'"
 +" WHEN lower(coalesce(operating_system,'')) LIKE '%mac%' OR lower(coalesce(operating_system,'')) LIKE '%os x%' THEN 'macOS'"
 +" WHEN lower(coalesce(operating_system,'')) LIKE '%vmware%' OR lower(coalesce(operating_system,'')) LIKE '%esxi%' THEN 'Virtual Infrastructure'"
 +" WHEN coalesce(operating_system,'')='' THEN 'Unclassified'"
 +" ELSE 'Other' END AS class, COUNT(uuid) AS assets FROM assets GROUP BY class ORDER BY assets DESC";
const CL_SIGNALS=[
  ['Network', "SELECT COUNT(DISTINCT asset_uuid) AS c FROM vulns WHERE lower(plugin_name) LIKE '%pfsense%' OR lower(plugin_name) LIKE '%fortigate%' OR lower(plugin_name) LIKE '%fortios%' OR lower(plugin_name) LIKE '%palo alto%' OR lower(plugin_name) LIKE '%pan-os%' OR lower(plugin_name) LIKE '%cisco ios%' OR lower(plugin_name) LIKE '%junos%' OR lower(plugin_name) LIKE '%arista%'"],
  ['IoT', "SELECT COUNT(DISTINCT asset_uuid) AS c FROM vulns WHERE lower(plugin_name) LIKE '%camera%' OR lower(plugin_name) LIKE '%hikvision%' OR lower(plugin_name) LIKE '%axis communications%' OR lower(plugin_name) LIKE '%nvr%' OR lower(plugin_name) LIKE '%printer%'"],
  ['OT', "SELECT COUNT(DISTINCT asset_uuid) AS c FROM vulns WHERE lower(plugin_name) LIKE '%scada%' OR lower(plugin_name) LIKE '%modbus%' OR lower(plugin_name) LIKE '%bacnet%' OR lower(plugin_name) LIKE '%plc%' OR lower(plugin_name) LIKE '%siemens s7%'"],
];

function _packWhere(cfg,frag){ return frag+(cfg.exclude?(' AND plugin_id NOT IN ('+cfg.exclude.map(p=>"'"+p+"'").join(',')+')'):''); }
function signalHTML(cfg){ const i=cfg.id;

function wireSignal(cfg){ const i=cfg.id;

    document.querySelectorAll('#'+i+'Board .sigTag').forEach(b=>b.onclick=()=>{ const r=out[+b.dataset.i]; tagCohort(r.name,r.where); }); };
  $(i+'-hunt').onclick=async()=>{ const term=$(i+'-term').value.trim(); if(!term){ $(i+'-msg').textContent='enter a term'; return; }
    if(!$(i+'-val').value.trim())$(i+'-val').value=term;

    $(i+'-msg').textContent='searching…'; const r=await query("SELECT DISTINCT asset_uuid FROM vulns WHERE "+w,200);
    if(!r.ok){ $(i+'-msg').innerHTML='<span style="color:var(--crit)">✗ '+esc(r.error)+'</span>'; return; }

  $(i+'-tag').onclick=async()=>{ const term=$(i+'-term').value.trim(); const val=($(i+'-val').value.trim()||term);

    const t=term.toLowerCase().replace(/'/g,"''"); const w=_packWhere(cfg,"(lower(plugin_name) LIKE '%"+t+"%' OR lower(output) LIKE '%"+t+"%')");
    const r=await tagCohort(val,w); if(r.cancelled){ $(i+'-msg').textContent=''; return; }
    $(i+'-msg').innerHTML=r.ok?'<span style="color:var(--ok)">✓ queued — see Tag log. ~30 min propagation.</span>':'<span style="color:var(--crit)">✗ '+esc(r.error||'failed')+'</span>'; }; }

/* ============================ CUSTOM APP TAGGING (Cavall) — full parity ============================
   Repo parity: hunt custom apps across BOTH vuln_route (named app routes) and vuln_paths

let CA_OWNED=new Set(), CA_ROUTES=[], CA_PATHS=[], CA_IGNORE=new Set();
function _nk(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function _plugins(s){ return (String(s||'').match(/\d+/g)||[]); }
function customappHTML(){ return `<div class="card"><div class="row"><div class="logo sm">🧩</div><div><h2 class="ct">Custom App Tagging</h2><div class="sub" style="font-size:12px">Cavall · name apps that inventory misses — from vuln routes &amp; filesystem paths</div></div></div>

    <div id="caFunnel" style="margin-top:8px"></div>
    <div id="caRoutes"></div><div id="caPaths"></div>
    <div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><input type="text" id="caIgn" class="val" placeholder="ignore term (false positive)" style="max-width:200px"><button class="btn sm" id="caIgnAdd">＋ ignore</button><span class="sub" id="caIgnList" style="font-size:12px"></span></div>
    <p class="note">Routes/paths come from <code>navi config update route</code> / <code>paths</code> (separate from a normal sync). Owned = already carries an Atlas <code>Owner</code> tag. The persistent ignore list lives in the repo (<code>ignore.json</code>); here it is session-scoped.</p></div>`; }
async function caLoadOwned(){ const r=await query("SELECT DISTINCT tag_value FROM tags WHERE tag_key='Owner' AND tag_value LIKE '%: %'",2000);
  CA_OWNED=new Set(); if(r.ok) rows(r.data).forEach(x=>{ const v=String(x.tag_value||''); const i=v.lastIndexOf(': '); if(i>0)CA_OWNED.add(_nk(v.slice(0,i))); }); }
function caRender(){ const hide=$('caHideOwned').checked; const ign=[...CA_IGNORE];
  const flt=x=>!(ign.some(t=>_nk(x).includes(t)));
  const routes=CA_ROUTES.filter(r=>flt(r.app_name)&&(!hide||!r.owned));
  const paths=CA_PATHS.filter(p=>flt(p.path)&&(!hide||!p.owned));
  $('caMsg').innerHTML='<b>'+fmt(routes.length)+'</b> route(s) · <b>'+fmt(paths.length)+'</b> path(s)'+(hide?' <span class="sub">(owned hidden)</span>':'');

function wireCustomapp(){

async function caFunnel(){ const host=$('caFunnel'); host.innerHTML='';

  if($('ctAgents')) $('ctAgents').innerHTML=TAGGERS.map(t=>'<div style="display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start;margin-top:8px">'+
    '<label style="padding-top:7px"><input type="checkbox" class="agEn" data-id="'+t.id+'"'+(CONTRACT.agents[t.id].enabled?' checked':'')+'> <b>'+esc(t.label)+'</b></label>'+
    '<textarea class="agPol" data-id="'+t.id+'" rows="2" placeholder="policy (blank = risk-weighted top-N)">'+esc(CONTRACT.agents[t.id].logic)+'</textarea></div>').join('');
  if($('ctAgents')){ $('ctAgents').querySelectorAll('.agEn').forEach(c=>c.onchange=()=>{CONTRACT.agents[c.dataset.id].enabled=c.checked; renderContract();});
    $('ctAgents').querySelectorAll('.agPol').forEach(t=>t.oninput=()=>{CONTRACT.agents[t.dataset.id].logic=t.value;}); }
  // ACR rules
  if($('ctAcrList')){ const A=CONTRACT.acr;
    $('ctAcrList').innerHTML=A.length?('<div class="tablewrap"><table><thead><tr><th>Category</th><th>Value</th><th>Mod</th><th>ACR</th><th>Reason</th><th></th></tr></thead><tbody>'+
      A.map((r,i)=>'<tr><td><input class="ar" data-i="'+i+'" data-f="category" value="'+esc(r.category||'')+'" style="width:130px"></td><td><input class="ar" data-i="'+i+'" data-f="value" value="'+esc(r.value||'')+'" style="width:150px"></td>'+
        '<td><select class="ar" data-i="'+i+'" data-f="mod"><option'+(r.mod!=='inc'&&r.mod!=='dec'?' selected':'')+'>set</option><option'+(r.mod==='inc'?' selected':'')+'>inc</option><option'+(r.mod==='dec'?' selected':'')+'>dec</option></select></td>'+
        '<td><input class="ar" data-i="'+i+'" data-f="score" value="'+esc(r.score||9)+'" style="width:44px"></td>'+
        '<td><select class="ar" data-i="'+i+'" data-f="reason">'+REASONS.map(x=>'<option'+((r.reasons&&r.reasons[0]===x)?' selected':'')+'>'+x+'</option>').join('')+'</select></td>'+
        '<td><button class="btn sm arDel" data-i="'+i+'">✕</button></td></tr>').join('')+'</tbody></table></div>')
      :'<p class="sub" style="margin-top:8px">No ACR rules. ACR is never auto-ranked — add explicit rules here.</p>';
    $('ctAcrList').querySelectorAll('.ar').forEach(inp=>inp.oninput=inp.onchange=()=>{const r=A[+inp.dataset.i],f=inp.dataset.f; if(f==='reason')r.reasons=[inp.value]; else r[f]=(f==='score')?(parseInt(inp.value,10)||9):inp.value;});
    $('ctAcrList').querySelectorAll('.arDel').forEach(b=>b.onclick=()=>{A.splice(+b.dataset.i,1); renderContract();}); }
  // removal phase
  if($('ctRemEnable')){ $('ctRemEnable').checked=CONTRACT.removal.enabled; $('ctRemPause').value=CONTRACT.removal.pause_minutes; $('ctRemUpd').checked=CONTRACT.removal.navi_update;
    const T=CONTRACT.removal.tags;
    $('ctRemList').innerHTML=T.length?T.map((t,i)=>'<div class="selrow"><input class="rr" data-i="'+i+'" data-f="category" value="'+esc(t.category||'')+'" style="width:130px"><span class="sub">:</span><input class="rr" data-i="'+i+'" data-f="value" value="'+esc(t.value||'')+'" style="width:170px"><button class="btn sm rrDel" data-i="'+i+'" style="margin-left:auto">✕</button></div>').join('')
      :'<p class="sub" style="margin-top:6px">No tags to remove. Add from Tag removal, or click <b>+ tag</b>.</p>';
    $('ctRemList').querySelectorAll('.rr').forEach(inp=>inp.oninput=()=>{T[+inp.dataset.i][inp.dataset.f]=inp.value;});
    $('ctRemList').querySelectorAll('.rrDel').forEach(b=>b.onclick=()=>{T.splice(+b.dataset.i,1); renderContract();}); }
}
async function ctSelector(t){ const pol=CONTRACT.agents[t.id].logic.trim();
  if(pol && window.cowork && window.cowork.askClaude){
    const p='For a Tenable navi.db, write ONE SELECT returning asset_uuid for the "'+t.label+'" enrichment agent, honoring this policy: "'+pol+'". '+SCHEMA+' Base cohort SQL (refine this): '+(t.sql||'')+'. Return ONLY the SQL, single statement, no fences.';
    try{ let r=await window.cowork.askClaude(p,[]); r=(typeof r==='string')?r:(r&&(r.text||r.output||''))+''; const sql=r.replace(/```sql|```/gi,'').trim().replace(/;+$/,''); if(/select/i.test(sql)) return {sql, note:'policy'}; }catch(e){}
  }
  return {sql:t.sql, note:'risk-weighted top-'+CONTRACT.top_n};
}
async function ctPlan(){ $('ctPlan').innerHTML='<p class="sub">planning (no writes)…</p>';
  const on=TAGGERS.filter(t=>CONTRACT.agents[t.id].enabled); const out=[];
  for(const t of on){
    if(t.special==='groups'){ const g=await info('agent_groups'); out.push({label:t.label,n:g.ok?rows(g.data).length:'—',note:'each agent group',value:'per group'}); continue; }
    const sel=await ctSelector(t); const r=await query(sel.sql,CONTRACT.top_n);
    out.push({label:t.label,n:r.ok?rows(r.data).length:('✗ '+esc(r.error)),note:sel.note,value:t.category+' : '+t.value}); }
  $('ctPlan').innerHTML='<div class="tablewrap"><table><thead><tr><th>Agent</th><th>Would tag</th><th>Assets (≤top-N)</th><th>Basis</th></tr></thead><tbody>'+
    out.map(o=>'<tr><td><b>'+esc(o.label)+'</b></td><td class="mono">'+esc(o.value)+'</td><td class="mono">'+esc(o.n)+'</td><td class="sub">'+esc(o.note)+'</td></tr>').join('')+'</tbody></table></div>';
}
async function ctRun(){ const on=TAGGERS.filter(t=>CONTRACT.agents[t.id].enabled);
  const okc=await confirmWrite('Run one contract cycle','Run the contract now: '+(CONTRACT.removal.enabled?'removal phase, then ':'')+'<b>'+on.length+'</b> agent(s)'+(CONTRACT.acr.length?' + '+CONTRACT.acr.length+' ACR rule(s)':'')+'. Each is a gated navi write, logged. The 30-min pause + schedule are enforced only in the navi/repo scheduler.','');
  if(!okc) return; $('ctMsg').textContent='running cycle…';
  const logrun=async(op,tool,args)=>{ const e={ts:new Date().toLocaleTimeString(),op,category:args.category,value:args.value,selector:(args.query?'query':args.group?'group':args.remove?'remove':''),status:'running',detail:'contract'}; TAGLOG.unshift(e); renderTagLog(); const r=await mcp(tool,Object.assign({confirm:true},args)); e.status=r.ok?'done':'error'; e.detail=r.ok?'contract':(r.error||'failed'); if(r.ok&&r.data&&r.data.writes_enabled===false){e.status='blocked';e.detail='writes gated';} renderTagLog(); return r; };
  if(CONTRACT.removal.enabled){ for(const t of CONTRACT.removal.tags){ if(t.category&&t.value) await logrun('remove','navi_enrich_tag',{category:t.category,value:t.value,remove:true}); } }
  for(const t of on){ if(t.special==='groups'){ const g=await info('agent_groups'); const gs=rows(g.data); const nk=gs.length?(Object.keys(gs[0]).find(k=>/name/i.test(k))||Object.keys(gs[0])[0]):null; for(const grp of gs){ if(nk) await logrun('tag','navi_enrich_tag',{category:'Agent Group',value:grp[nk],group:grp[nk]}); } continue; }
    const sel=await ctSelector(t); await logrun('tag','navi_enrich_tag',{category:t.category,value:t.value,query:sel.sql}); }
  for(const a of CONTRACT.acr){ if(a.category&&a.value){ const args={category:a.category,value:a.value,score:a.score||9,mod:a.mod||'set'}; args[(a.reasons&&a.reasons[0])||'business']=true; await logrun('acr','navi_enrich_acr',args); } }
  $('ctMsg').innerHTML='<span style="color:var(--ok)">✓ cycle queued — see Tag log. ~30 min propagation.</span>';
}
function ctExportScript(){ let s='#!/usr/bin/env bash\n# The Hounds — AI Navi Contract (exported)\nset -e\n';
  if(CONTRACT.removal.enabled) CONTRACT.removal.tags.forEach(t=>{ if(t.category&&t.value) s+='navi enrich tag --c "'+t.category+'" --v "'+t.value+'" -remove\n'; });
  if(CONTRACT.removal.enabled) s+='echo "waiting '+CONTRACT.removal.pause_minutes+'m"; sleep '+(CONTRACT.removal.pause_minutes*60)+'\n'+(CONTRACT.removal.navi_update?'navi update -d\n':'');
  TAGGERS.filter(t=>CONTRACT.agents[t.id].enabled).forEach(t=>{ if(t.special==='groups'){ s+='# agent groups: loop navi enrich tag --c "Agent Group" --v <name> --group <name>\n'; return; }
    const pol=CONTRACT.agents[t.id].logic.trim(); s+=(pol?('# policy: '+pol+'\n'):'')+'navi enrich tag --c "'+t.category+'" --v "'+t.value+'" --query "'+(t.sql||'').replace(/"/g,'\\"')+'"\n'; });
  CONTRACT.acr.forEach(a=>{ if(a.category&&a.value) s+='navi enrich acr --c "'+a.category+'" --v "'+a.value+'" --acr '+(a.score||9)+' --'+((a.reasons&&a.reasons[0])||'business')+'\n'; });
  const blob=new Blob([s],{type:'text/plain'}); const el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download='hounds-contract.sh'; el.click();
}
function wireContract(){
  $('ctPlanBtn').onclick=ctPlan; $('ctRunBtn').onclick=ctRun;
  $('ctArm').onclick=()=>{ CONTRACT.armed=!CONTRACT.armed; renderContract(); $('ctMsg').innerHTML=CONTRACT.armed?'<span style="color:var(--ok)">armed — the recurring loop runs in navi/repo; use Run one cycle here.</span>':'disarmed'; };
  $('ctBuild').onclick=()=>{ // seed removal + ACR from this session's tag log
    TAGLOG.forEach(e=>{ if(e.op==='remove'&&e.category&&!CONTRACT.removal.tags.find(t=>t.category===e.category&&t.value===e.value)){ CONTRACT.removal.tags.push({category:e.category,value:e.value}); CONTRACT.removal.enabled=true; } });
    renderContract(); $('ctMsg').textContent='seeded from tag log'; };
  $('ctAcrAdd').onclick=()=>{ CONTRACT.acr.push({category:'',value:'',mod:'set',score:9,reasons:['business']}); renderContract(); };
  $('ctRemAdd').onclick=()=>{ CONTRACT.removal.tags.push({category:'',value:''}); CONTRACT.removal.enabled=true; renderContract(); };
  $('ctRemEnable').onchange=e=>CONTRACT.removal.enabled=e.target.checked;
  $('ctRemPause').oninput=e=>CONTRACT.removal.pause_minutes=parseInt(e.target.value,10)||30;
  $('ctRemUpd').onchange=e=>CONTRACT.removal.navi_update=e.target.checked;
  $('ctExport').onclick=()=>{ const blob=new Blob([JSON.stringify(CONTRACT,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='navi-contract.json'; a.click(); };
  $('ctScript').onclick=ctExportScript;
  $('ctImport').onclick=()=>$('ctFile').click();
  $('ctFile').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ CONTRACT=JSON.parse(rd.result); renderContract(); $('ctMsg').textContent='imported'; }catch(x){ $('ctMsg').innerHTML='<span style="color:var(--crit)">invalid JSON</span>'; } }; rd.readAsText(f); };
  $('ctSave').onclick=()=>{ try{ localStorage.setItem('hounds-contract',JSON.stringify(CONTRACT)); $('ctMsg').textContent='saved in this browser'; }catch(x){ $('ctMsg').textContent='save unavailable'; } };
  try{ const s=localStorage.getItem('hounds-contract'); if(s) CONTRACT=JSON.parse(s); }catch(x){}
}

/* ============================ Tag log panel ============================ */
function taglogHTML(){ return `<div class="card"><div class="row"><h2 class="ct">Session tag log</h2><button class="btn sm" id="tlClear" style="margin-left:auto">Clear</button></div>
  <p class="sub" style="font-size:12.5px;margin:2px 0 0">Every gated write this artifact made. Session-scoped — durable history lives in navi's tag-job store (a future navi MCP capability).</p>
  <div id="tlBody"></div></div>`; }

/* ============================ SHELL / BUILD ============================ */
const PANELS=[
 {v:'classify',label:'Classify'},{v:'iot',label:'IoT / OT'},{v:'identity',label:'Identity'},
 {v:'software',label:'Software'},{v:'customapp',label:'Custom App'},{v:'groups',label:'Agent groups'},
 {v:'acr',label:'ACR'},{v:'contract',label:'AI Contract'},{v:'taglog',label:'Tag log'}];
function build(){
  $('tabs').innerHTML=PANELS.map((p,i)=>'<button data-v="'+p.v+'"'+(i===0?' class="on"':'')+'>'+p.label+'</button>').join('');
  let html='';
  html+='<section class="view on" id="v-classify">'+classifyHTML()+'</section>';
  html+='<section class="view" id="v-iot">'+signalHTML(IOT_CFG)+'</section>';
  html+='<section class="view" id="v-identity">'+signalHTML(IDENT_CFG)+'</section>';
  ENRICH.forEach(c=>{ html+='<section class="view" id="v-'+c.id+'">'+findTagHTML(c)+'</section>'; });
  html+='<section class="view" id="v-software">'+softwareHTML()+'</section>';
  html+='<section class="view" id="v-customapp">'+customappHTML()+'</section>';
  html+='<section class="view" id="v-groups">'+groupsHTML()+'</section>';
  html+='<section class="view" id="v-acr">'+acrHTML()+'</section>';
  html+='<section class="view" id="v-contract">'+contractHTML()+'</section>';
  html+='<section class="view" id="v-taglog">'+taglogHTML()+'</section>';
  $('panels').innerHTML=html;
  wireClassify(); wireSignal(IOT_CFG); wireSignal(IDENT_CFG); ENRICH.forEach(wireFindTag); wireSoftware(); wireCustomapp(); wireGroups(); wireAcr(); wireContract();
  $('tlClear').onclick=()=>{ TAGLOG=[]; renderTagLog(); renderContract(); };
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); $('v-'+b.dataset.v).classList.add('on');
    if(b.dataset.v==='contract') renderContract(); if(b.dataset.v==='taglog') renderTagLog(); });
  renderTagLog(); renderContract();
}
async function probe(){ LASTERR='';
  const r=await query("SELECT COUNT(uuid) AS c FROM assets",1); LIVE=r.ok;
  const s=$('srcChip'); s.className='chip '+(LIVE?'live':'demo');
  s.textContent=LIVE?('● live · '+fmt((rows(r.data)[0]||{}).c)+' assets'):'not connected to navi';
  const eb=$('err');
  if(!LIVE){ eb.style.display='block'; eb.innerHTML='<b>navi MCP not reachable.</b> <code>'+esc(LASTERR)+'</code> — connect the navi plugin, then ⟳ recheck.'; } else eb.style.display='none';
}
$('retry').onclick=probe;
build(); probe();
